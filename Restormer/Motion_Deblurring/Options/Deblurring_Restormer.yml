
name: Deblurring_Restormer_CustomLoss
model_type: ImageCleanModel
scale: 1
num_gpu: 1
manual_seed: 100

datasets:
  train:
    name: TrainSet
    type: Dataset_PairedImage
    dataroot_gt: ./Datasets/train/GoPro/target_crops
    dataroot_lq: ./Datasets/train/GoPro/input_crops
    geometric_augs: true

    filename_tmpl: '{}'
    io_backend:
      type: disk

    use_shuffle: true
    num_worker_per_gpu: 2
    batch_size_per_gpu: 1

    mini_batch_sizes: [1]
    iters: [100]
    gt_size: 128
    gt_sizes: [128]

    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: ValSet
    type: Dataset_PairedImage
    dataroot_gt: ./Datasets/val/GoPro/target_crops
    dataroot_lq: ./Datasets/val/GoPro/input_crops
    io_backend:
      type: disk
network_g:
  type: Restormer
  inp_channels: 3
  out_channels: 3
  dim: 48
  num_blocks: [4, 6, 6, 8]
  num_refinement_blocks: 4
  heads: [1, 2, 4, 8]
  ffn_expansion_factor: 2.66
  bias: false
  LayerNorm_type: WithBias
  dual_pixel_task: false


path:
  pretrain_network_g: ./pretrained_models/motion_deblurring.pth
  strict_load_g: true
  resume_state: ~

train:
  total_iter: 100
  warmup_iter: -1
  use_grad_clip: true

  scheduler:
    type: CosineAnnealingRestartCyclicLR
    periods: [50, 50]
    restart_weights: [1, 1]
    eta_mins: [0.000001, 0.000001]

  mixing_augs:
    mixup: false
    mixup_beta: 1.2
    use_identity: true

  optim_g:
    type: AdamW
    lr: !!float 1e-5
    weight_decay: !!float 1e-4
    betas: [0.9, 0.999]

  pixel_opt:
    type: CombinedDeblurLoss
    charbonnier_weight: 0.5
    ssim_weight: 0.3
    edge_weight: 0.2
    eps: 0.001

val:
  window_size: 8
  val_freq: 50
  save_img: true
  rgb2bgr: true
  use_image: true
  max_minibatch: 1

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false

logger:
  print_freq: 1
  save_checkpoint_freq: 100
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

dist_params:
  backend: gloo
  port: 29500
